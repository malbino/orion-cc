<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./../../WEB-INF/systemTemplate.xhtml">

            <ui:define name="content">
                <div class="row">
                    <div class="col-md-12 col-sm-12 ">
                        <div class="x_panel">
                            <div class="x_title">
                                <h2>Cambio de Carrera <small>registrar estudiante regular nueva carrera</small></h2>

                                <div class="clearfix"></div>
                            </div>

                            <div class="x_content">
                                <h:form id="form">

                                    <p:wizard backLabel="Atrás" nextLabel="Siguiente" flowListener="#{CambioCarreraController.onFlowProcess}">
                                        <p:tab id="inscripcion" title="Inscripcion">
                                            <p:panel header="Datos inscripcion">
                                                <p:messages/>

                                                <div class="ui-g ui-fluid">
                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="estudiante" value="Estudiante:"/>
                                                        <p:autoComplete id="estudiante" value="#{CambioCarreraController.inscrito.estudiante}" completeMethod="#{CambioCarreraController.completarEstudiante}" minQueryLength="3" queryDelay="1000" scrollHeight="300"
                                                                        var="estudiante" itemLabel="#{estudiante.toString()}" itemValue="#{estudiante}" converter="#{EstudianteConverter}" forceSelection="true"
                                                                        required="true" requiredMessage="* Estudiante requerido.">

                                                            <p:ajax event="itemSelect" update="carrera"/>
                                                        </p:autoComplete>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="fecha" value="Fecha:" style="font-size: small"/>
                                                        <p:calendar id="fecha" value="#{CambioCarreraController.inscrito.fecha}" locale="es" pattern="dd/MM/yyyy" mask="true" showButtonPanel="true" navigator="true" required="true" requiredMessage="* Fecha requerida."/>  
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="gestionAcademica" value="Gestion academica:" style="font-size: small"/> 
                                                        <p:selectOneMenu id="gestionAcademica" value="#{CambioCarreraController.inscrito.gestionAcademica}" converter="#{GestionAcademicaConverter}" autoWidth="false" required="true" requiredMessage="* Gestion academica requerida."> 
                                                            <f:selectItem itemLabel="" itemValue="" />
                                                            <f:selectItems value="#{CambioCarreraController.listaGestionesAcademicas()}" var="gestionAcademica" itemLabel="#{gestionAcademica.toString()}" itemValue="#{gestionAcademica}"/>  

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="campus" value="Campus: " style="font-size: small"/>
                                                        <p:selectOneMenu id="campus" value="#{CambioCarreraController.inscrito.campus}" converter="#{CampusConverter}" autoWidth="false" required="true" requiredMessage="* Campus requerido.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{CambioCarreraController.listaCampus()}" var="campus" itemLabel="#{campus.toString()}" itemValue="#{campus}"/>

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="carrera" value="Carrera:" style="font-size: small"/>
                                                        <p:selectOneMenu id="carrera" value="#{CambioCarreraController.inscrito.carrera}" converter="#{CarreraConverter}" autoWidth="false" required="true" requiredMessage="* Carrera requerida.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{CambioCarreraController.listaCarreras()}" var="carrera" itemLabel="#{carrera.toString()}" itemValue="#{carrera}"/>

                                                            <p:ajax update="planPago"/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="planPago" value="Plan de Pago: " style="font-size: small"/>
                                                        <p:selectOneMenu id="planPago" value="#{CambioCarreraController.inscrito.planPago}" converter="#{PlanPagoConverter}" autoWidth="false" required="true" requiredMessage="* Plan de Pago requerido.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{CambioCarreraController.listaPlanesPago()}" var="cuota" itemLabel="#{cuota.toString()}" itemValue="#{cuota}"/>

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>
                                                </div>

                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="modulos" title="Modulos">
                                            <p:panel header="Modulos inscripcion">
                                                <p:messages/>

                                                <p:dataTable id="notas" var="nota" rowKey="#{nota.hashCode()}" rowIndexVar="rowIndex" value="#{CambioCarreraController.inscrito.notas}"
                                                             editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                                    <f:facet name="header">
                                                        Modulos
                                                    </f:facet>
                                                    <p:column headerText="Nº" groupRow="true">
                                                        <h:outputText value="#{rowIndex + 1}"/>
                                                    </p:column>

                                                    <p:column headerText="Codigo" >  
                                                        <h:outputText value="#{nota.modulo.codigo}"/>
                                                    </p:column>

                                                    <p:column headerText="Modulo" >  
                                                        <h:outputText value="#{nota.modulo.nombre}"/>
                                                    </p:column>

                                                    <p:column headerText="Grupo">
                                                        <p:cellEditor>
                                                            <f:facet name="output"><h:outputText value="#{nota.grupo.toString_InscripcionInternet()}"/></f:facet>
                                                            <f:facet name="input">
                                                                <h:selectOneMenu id="grupo" value="#{nota.grupo}" converter="#{GrupoConverter}" style="width:100%">
                                                                    <f:selectItem itemLabel="" itemValue="" />
                                                                    <f:selectItems value="#{CambioCarreraController.listaGruposAbiertos(nota.modulo)}" var="grupo" itemLabel="#{grupo.toString_InscripcionInternet()}" itemValue="#{grupo}" />
                                                                </h:selectOneMenu>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                </p:dataTable>
                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="planPagos" title="Plan de pagos">
                                            <p:panel header="Plan de pagos inscripciion">
                                                <p:messages/>

                                                <p:remoteCommand name="cu" update="cuotas"/>
                                                <p:dataTable id="cuotas" var="cuota" rowKey="#{cuota.hashCode()}" rowIndexVar="rowIndex" value="#{CambioCarreraController.inscrito.cuotas}"
                                                             editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                                    <f:facet name="header">
                                                        Cuotas
                                                    </f:facet>

                                                    <p:column headerText="No" >
                                                        <h:outputText value="#{cuota.numero}"/>
                                                    </p:column>

                                                    <p:column headerText="Codigo" >
                                                        <h:outputText value="#{cuota.codigo}"/>
                                                    </p:column>

                                                    <p:column headerText="Unidad Medida" >
                                                        <h:outputText value="#{cuota.unidadMedida}"/>
                                                    </p:column>

                                                    <p:column headerText="Descripcion" >
                                                        <h:outputText value="#{cuota.descripcion}"/>
                                                    </p:column>

                                                    <p:column headerText="Monto (Bs.)" style="text-align: right">
                                                        <p:cellEditor>
                                                            <f:facet name="output">
                                                                <h:outputText value="#{cuota.monto()}"/>
                                                            </f:facet>
                                                            <f:facet name="input">
                                                                <p:inputNumber value="#{cuota.monto}" minValue="0" decimalPlaces="2" emptyValue="zero" size="10">
                                                                    <p:ajax event="change" oncomplete="cu()"/>
                                                                </p:inputNumber>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                    <p:column headerText="Pagado (Bs.)" style="text-align: right">
                                                        <h:outputText value="#{cuota.pagado()}"/>
                                                    </p:column>

                                                    <p:column headerText="Adeudado" style="text-align: right">
                                                        <h:outputText value="#{cuota.adeudado()}"/>
                                                    </p:column>

                                                    <p:column headerText="Fecha de Vencimiento">
                                                        <p:cellEditor>
                                                            <f:facet name="output">
                                                                <h:outputText value="#{cuota.fechaVencimiento()}" />
                                                            </f:facet>
                                                            <f:facet name="input">
                                                                <p:calendar id="fecha" 
                                                                            value="#{cuota.fechaVencimiento}"
                                                                            locale="es"
                                                                            pattern="dd/MM/yyyy"
                                                                            showButtonPanel="true"
                                                                            navigator="true"
                                                                            autocomplete="false"/>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                    <p:column headerText="Condicion" >
                                                        <h:outputText value="#{cuota.condicion()}"/>
                                                    </p:column>
                                                </p:dataTable>
                                            </p:panel>
                                            <div class="ui-g ui-fluid">
                                                <div class="ui-g-12 ui-md-2">
                                                    <p:commandButton value="Guardar" icon="fa fa-save" actionListener="#{CambioCarreraController.registrarEstudiante()}" update="form"/>
                                                </div>

                                                <div class="ui-g-12 ui-md-2">
                                                    <p:commandButton value="Cancelar" icon="fa fa-remove" process="@this" actionListener="#{CambioCarreraController.cancelar()}" update="form"/>
                                                </div>
                                            </div>
                                        </p:tab>
                                    </p:wizard>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
