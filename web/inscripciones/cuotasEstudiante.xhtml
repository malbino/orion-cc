<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./../WEB-INF/systemTemplate.xhtml">

            <ui:define name="content">
                <div class="row">
                    <div class="col-md-12 col-sm-12 ">
                        <h:form id="form">
                            <div class="x_panel">
                                <div class="x_title">
                                    <div class="ui-g ui-fluid">
                                        <h2>Cuotas Estudiante <small>edición cuotas estudiante</small></h2>
                                    </div>   
                                    <div class="clearfix"></div>
                                </div>

                                <div class="x_content">
                                    <p:messages id="messages"/>

                                    <div class="ui-g ui-fluid">
                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="estudiante" value="Estudiante:"/>
                                            <p:autoComplete id="estudiante" value="#{CuotasEstudianteController.seleccionEstudiante}" completeMethod="#{CuotasEstudianteController.completarEstudiante}" minQueryLength="3" queryDelay="1000" scrollHeight="300"
                                                            var="estudiante" itemLabel="#{estudiante.toString()}" itemValue="#{estudiante}" converter="#{EstudianteConverter}" forceSelection="true"
                                                            required="true" requiredMessage="* Estudiante requerido.">

                                                <p:ajax event="itemSelect" update="inscrito"/>
                                            </p:autoComplete>
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="inscrito" value="Carrera:"/>
                                            <p:selectOneMenu id="inscrito" value="#{CuotasEstudianteController.seleccionInscrito}" converter="#{InscritoConverter}" autoWidth="false" required="true" requiredMessage="* Carrera requerida.">
                                                <f:selectItem itemLabel="" itemValue=""/>
                                                <f:selectItems value="#{CuotasEstudianteController.listaInscritos()}" var="inscrito" itemLabel="#{inscrito.toString()}" itemValue="#{inscrito}"/>

                                                <p:ajax update="cuotas"/>
                                            </p:selectOneMenu>
                                        </div>
                                    </div>

                                    <p:spacer/>

                                    <p:toolbar>
                                        <f:facet name="left">
                                            <h:outputText/>
                                        </f:facet>

                                        <f:facet name="right">
                                            <p:menuButton icon="fa fa-gear" title="Opciones">
                                                <p:menuitem value="Exportar" icon="fa fa-file-excel-o" ajax="false">
                                                    <p:dataExporter type="xlsx" target="cuotas" fileName="cuotasEstudiante" />
                                                </p:menuitem>
                                            </p:menuButton>
                                        </f:facet>
                                    </p:toolbar>

                                    <p:spacer/>

                                    <p:remoteCommand name="cu" update="cuotas"/>
                                    <p:dataTable id="cuotas" var="cuota" rowKey="#{cuota.hashCode()}" rowIndexVar="rowIndex" value="#{CuotasEstudianteController.seleccionInscrito.cuotas}"
                                                 editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                        <f:facet name="header">
                                            Cuotas
                                        </f:facet>

                                        <p:column headerText="No" >
                                            <h:outputText value="#{cuota.numero}"/>
                                        </p:column>

                                        <p:column headerText="Codigo" >
                                            <h:outputText value="#{cuota.codigo}"/>
                                        </p:column>

                                        <p:column headerText="Unidad Medida" >
                                            <h:outputText value="#{cuota.unidadMedida}"/>
                                        </p:column>

                                        <p:column headerText="Descripcion" >
                                            <h:outputText value="#{cuota.descripcion}"/>
                                        </p:column>

                                        <p:column headerText="Monto (Bs.)" style="text-align: right">
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{cuota.monto()}"/>
                                                </f:facet>
                                                <f:facet name="input">
                                                    <p:inputNumber value="#{cuota.monto}" minValue="0" decimalPlaces="2" emptyValue="zero" size="10">
                                                        <p:ajax event="change" listener="#{CuotasEstudianteController.editarCuota(cuota)}" oncomplete="cu()"/>
                                                    </p:inputNumber>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>

                                        <p:column headerText="Pagado (Bs.)" style="text-align: right">
                                            <h:outputText value="#{cuota.pagado()}"/>
                                        </p:column>

                                        <p:column headerText="Adeudado" style="text-align: right">
                                            <h:outputText value="#{cuota.adeudado()}"/>
                                        </p:column>

                                        <p:column headerText="Fecha de Vencimiento">
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{cuota.fechaVencimiento()}" />
                                                </f:facet>
                                                <f:facet name="input">
                                                    <p:calendar id="fecha" 
                                                                value="#{cuota.fechaVencimiento}"
                                                                locale="es"
                                                                pattern="dd/MM/yyyy"
                                                                showButtonPanel="true"
                                                                navigator="true"
                                                                autocomplete="false"/>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>

                                        <p:column headerText="Condicion" >
                                            <h:outputText value="#{cuota.condicion()}"/>
                                        </p:column>
                                    </p:dataTable>

                                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                                        <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes" icon="fa fa-check" />
                                        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="fa fa-times" />
                                    </p:confirmDialog>
                                </div>
                            </div>
                        </h:form>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
