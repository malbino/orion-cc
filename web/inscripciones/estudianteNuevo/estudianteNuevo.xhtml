<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./../../WEB-INF/systemTemplate.xhtml">

            <ui:define name="content">
                <div class="row">
                    <div class="col-md-12 col-sm-12 ">
                        <div class="x_panel">
                            <div class="x_title">
                                <h2>Estudiante Nuevo <small>registrar nuevo estudiante</small></h2>

                                <div class="clearfix"></div>
                            </div>

                            <div class="x_content">
                                <h:form id="form">

                                    <p:wizard backLabel="Atrás" nextLabel="Siguiente" flowListener="#{EstudianteNuevoController.onFlowProcess}">
                                        <p:tab id="personal" title="Personal">
                                            <p:panel header="Datos personales">
                                                <p:messages/>

                                                <div class="ui-g ui-fluid">
                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="nombre" value="Nombre:" style="font-size: small"/>
                                                        <p:inputText id="nombre" value="#{EstudianteNuevoController.inscrito.estudiante.nombre}" required="true" requiredMessage="* Nombre requerido." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="primerApellido" value="Primer apellido:" style="font-size: small"/>
                                                        <p:inputText id="primerApellido" value="#{EstudianteNuevoController.inscrito.estudiante.primerApellido}" required="true" requiredMessage="* Primer apellido requerido." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="segundoApellido" value="Segundo apellido:" style="font-size: small"/>
                                                        <p:inputText id="segundoApellido" value="#{EstudianteNuevoController.inscrito.estudiante.segundoApellido}" />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="dni" value="DNI:" style="font-size: small"/>
                                                        <p:inputText id="dni" value="#{EstudianteNuevoController.inscrito.estudiante.dni}" required="true" requiredMessage="* DNI requerido." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="lugarExpedicion" value="Lugar expedición:" style="font-size: small"/>
                                                        <p:selectOneMenu id="lugarExpedicion" value="#{EstudianteNuevoController.inscrito.estudiante.lugarExpedicion}" converter="#{LugarExpedicionConverter}" autoWidth="false" required="false"> 
                                                            <f:selectItem itemLabel="" itemValue="" />
                                                            <f:selectItems value="#{EstudianteNuevoController.listaLugaresExpedicion()}" var="lugarExpedicion" itemLabel="#{lugarExpedicion}" itemValue="#{lugarExpedicion}"/>  
                                                        </p:selectOneMenu> 
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="fechaNacimiento" value="Fecha de nacimiento:" style="font-size: small"/>
                                                        <p:calendar id="fechaNacimiento" value="#{EstudianteNuevoController.inscrito.estudiante.fechaNacimiento}" locale="es" pattern="dd/MM/yyyy" mask="true" showButtonPanel="true" navigator="true" yearRange="c-100:c+100" required="true" requiredMessage="* Fecha de nacimiento requerido."/>  
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="lugarNacimiento" value="Lugar de nacimiento:" style="font-size: small"/>
                                                        <p:inputText id="lugarNacimiento" value="#{EstudianteNuevoController.inscrito.estudiante.lugarNacimiento}" required="true" requiredMessage="* Lugar de nacimiento requerido." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="nacionalidad" value="Nacionalidad:" style="font-size: small"/>
                                                        <p:inputText id="nacionalidad" value="#{EstudianteNuevoController.inscrito.estudiante.nacionalidad}" required="true" requiredMessage="* Nacionalidad requerida." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="sexo" value="Sexo:" style="font-size: small"/>
                                                        <p:selectOneMenu id="sexo" value="#{EstudianteNuevoController.inscrito.estudiante.sexo}" converter="#{SexoConverter}" autoWidth="false" required="true" requiredMessage="* Sexo requerido."> 
                                                            <f:selectItem itemLabel="" itemValue="" />
                                                            <f:selectItems value="#{EmpleadoController.listaSexos()}" var="sexo" itemLabel="#{sexo}" itemValue="#{sexo}"/>  
                                                        </p:selectOneMenu> 
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="direccion" value="Dirección:" style="font-size: small"/>
                                                        <p:inputText id="direccion" value="#{EstudianteNuevoController.inscrito.estudiante.direccion}" required="true" requiredMessage="* Dirección requerida." />
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="telefono" value="Teléfono:" style="font-size: small"/> 
                                                        <p:inputMask id="telefono" value="#{EstudianteNuevoController.inscrito.estudiante.telefono}" mask="9999999" required="false"/>

                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="celular" value="Celular:" style="font-size: small"/> 
                                                        <p:inputMask id="celular" value="#{EstudianteNuevoController.inscrito.estudiante.celular}" mask="99999999" required="false"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="email" value="Email:" style="font-size: small"/> 
                                                        <p:inputText id="email" value="#{EstudianteNuevoController.inscrito.estudiante.email}" required="true" requiredMessage="* Email requerido.">
                                                            <f:validator validatorId="validators.emailValidator" />
                                                        </p:inputText>
                                                    </div>
                                                </div>
                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="documentos" title="Documentos">
                                            <p:panel header="Documentos file">
                                                <p:messages/>

                                                <div class="ui-g ui-fluid">
                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="diplomaBachiller" value="Diploma bachiller:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="diplomaBachiller" value="#{EstudianteNuevoController.inscrito.estudiante.diplomaBachiller}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="certificadoNacimiento" value="Certificado de nacimiento:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="certificadoNacimiento" value="#{EstudianteNuevoController.inscrito.estudiante.certificadoNacimiento}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="cedulaIdentidad" value="Cédula de Identidad:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="cedulaIdentidad" value="#{EstudianteNuevoController.inscrito.estudiante.cedulaIdentidad}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="fotografias3X3" value="Fotografías 3x3:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="fotografias3X3" value="#{EstudianteNuevoController.inscrito.estudiante.fotografias3X3}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="certificadoFELCC" value="Certificado FELCC:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="certificadoFELCC" value="#{EstudianteNuevoController.inscrito.estudiante.certificadoFELCC}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="certificadoFELCN" value="Certificado FELCN:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="certificadoFELCN" value="#{EstudianteNuevoController.inscrito.estudiante.certificadoFELCN}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="certificadoMedico" value="Certificado Medico:" style="font-size: small"/>
                                                        <p:selectBooleanButton id="certificadoMedico" value="#{EstudianteNuevoController.inscrito.estudiante.certificadoMedico}" onLabel="Sí" offLabel="No" onIcon="fa fa-check" offIcon="fa fa-ban"/>
                                                    </div>
                                                </div>
                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="inscripcion" title="Inscripcion">
                                            <p:panel header="Datos inscripcion">
                                                <p:messages/>

                                                <div class="ui-g ui-fluid">
                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="fecha" value="Fecha:" style="font-size: small"/>
                                                        <p:calendar id="fecha" value="#{EstudianteNuevoController.inscrito.estudiante.fecha}" locale="es" pattern="dd/MM/yyyy" mask="true" showButtonPanel="true" navigator="true" required="true" requiredMessage="* Fecha requerida."/>  
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="gestionAcademica" value="Gestion academica:" style="font-size: small"/> 
                                                        <p:selectOneMenu id="gestionAcademica" value="#{EstudianteNuevoController.inscrito.gestionAcademica}" converter="#{GestionAcademicaConverter}" autoWidth="false" required="true" requiredMessage="* Gestion academica requerida."> 
                                                            <f:selectItem itemLabel="" itemValue="" />
                                                            <f:selectItems value="#{EstudianteNuevoController.listaGestionesAcademicas()}" var="gestionAcademica" itemLabel="#{gestionAcademica.toString()}" itemValue="#{gestionAcademica}"/>

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="campus" value="Campus: " style="font-size: small"/>
                                                        <p:selectOneMenu id="campus" value="#{EstudianteNuevoController.inscrito.campus}" converter="#{CampusConverter}" autoWidth="false" required="true" requiredMessage="* Campus requerido.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{EstudianteNuevoController.listaCampus()}" var="campus" itemLabel="#{campus.toString()}" itemValue="#{campus}"/>

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="carrera" value="Carrera:" style="font-size: small"/>
                                                        <p:selectOneMenu id="carrera" value="#{EstudianteNuevoController.inscrito.carrera}" converter="#{CarreraConverter}" autoWidth="false" required="true" requiredMessage="* Carrera requerida.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{EstudianteNuevoController.listaCarreras()}" var="carrera" itemLabel="#{carrera.toString()}" itemValue="#{carrera}"/>

                                                            <p:ajax update="planPago"/>
                                                        </p:selectOneMenu>
                                                    </div>

                                                    <div class="ui-g-12 ui-md-4">
                                                        <p:outputLabel for="planPago" value="Plan de Pago: " style="font-size: small"/>
                                                        <p:selectOneMenu id="planPago" value="#{EstudianteNuevoController.inscrito.planPago}" converter="#{PlanPagoConverter}" autoWidth="false" required="true" requiredMessage="* Plan de Pago requerido.">
                                                            <f:selectItem itemLabel="" itemValue=""/>
                                                            <f:selectItems value="#{EstudianteNuevoController.listaPlanesPago()}" var="cuota" itemLabel="#{cuota.toString()}" itemValue="#{cuota}"/>

                                                            <p:ajax/>
                                                        </p:selectOneMenu>
                                                    </div>
                                                </div>
                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="modulos" title="Modulos">
                                            <p:panel header="Modulos inscripcion">
                                                <p:messages/>

                                                <p:dataTable id="notas" var="nota" rowKey="#{nota.hashCode()}" rowIndexVar="rowIndex" value="#{EstudianteNuevoController.inscrito.notas}"
                                                             editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                                    <f:facet name="header">
                                                        Modulos
                                                    </f:facet>
                                                    <p:column headerText="Nº" groupRow="true">
                                                        <h:outputText value="#{rowIndex + 1}"/>
                                                    </p:column>

                                                    <p:column headerText="Codigo" >  
                                                        <h:outputText value="#{nota.modulo.codigo}"/>
                                                    </p:column>

                                                    <p:column headerText="Modulo" >  
                                                        <h:outputText value="#{nota.modulo.nombre}"/>
                                                    </p:column>

                                                    <p:column headerText="Grupo">
                                                        <p:cellEditor>
                                                            <f:facet name="output"><h:outputText value="#{nota.grupo.toString_InscripcionInternet()}"/></f:facet>
                                                            <f:facet name="input">
                                                                <h:selectOneMenu id="grupo" value="#{nota.grupo}" converter="#{GrupoConverter}" style="width:100%">
                                                                    <f:selectItem itemLabel="" itemValue="" />
                                                                    <f:selectItems value="#{EstudianteNuevoController.listaGruposAbiertos(nota.modulo)}" var="grupo" itemLabel="#{grupo.toString_InscripcionInternet()}" itemValue="#{grupo}" />
                                                                </h:selectOneMenu>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                </p:dataTable>
                                            </p:panel>
                                        </p:tab>

                                        <p:tab id="planPagos" title="Plan de pagos">
                                            <p:panel header="Plan de pagos inscripciion">
                                                <p:messages/>

                                                <p:remoteCommand name="cu" update="cuotas"/>
                                                <p:dataTable id="cuotas" var="cuota" rowKey="#{cuota.hashCode()}" rowIndexVar="rowIndex" value="#{EstudianteNuevoController.inscrito.cuotas}"
                                                             editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                                    <f:facet name="header">
                                                        Cuotas
                                                    </f:facet>

                                                    <p:column headerText="No" >
                                                        <h:outputText value="#{cuota.numero}"/>
                                                    </p:column>

                                                    <p:column headerText="Codigo" >
                                                        <h:outputText value="#{cuota.codigo}"/>
                                                    </p:column>

                                                    <p:column headerText="Unidad Medida" >
                                                        <h:outputText value="#{cuota.unidadMedida}"/>
                                                    </p:column>

                                                    <p:column headerText="Descripcion" >
                                                        <h:outputText value="#{cuota.descripcion}"/>
                                                    </p:column>

                                                    <p:column headerText="Monto (Bs.)" style="text-align: right">
                                                        <p:cellEditor>
                                                            <f:facet name="output">
                                                                <h:outputText value="#{cuota.monto()}"/>
                                                            </f:facet>
                                                            <f:facet name="input">
                                                                <p:inputNumber value="#{cuota.monto}" minValue="0" decimalPlaces="2" emptyValue="zero" size="10">
                                                                    <p:ajax event="change" oncomplete="cu()"/>
                                                                </p:inputNumber>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                    <p:column headerText="Pagado (Bs.)" style="text-align: right">
                                                        <h:outputText value="#{cuota.pagado()}"/>
                                                    </p:column>

                                                    <p:column headerText="Adeudado" style="text-align: right">
                                                        <h:outputText value="#{cuota.adeudado()}"/>
                                                    </p:column>

                                                    <p:column headerText="Fecha de Vencimiento">
                                                        <p:cellEditor>
                                                            <f:facet name="output">
                                                                <h:outputText value="#{cuota.fechaVencimiento()}" />
                                                            </f:facet>
                                                            <f:facet name="input">
                                                                <p:calendar id="fecha" 
                                                                            value="#{cuota.fechaVencimiento}"
                                                                            locale="es"
                                                                            pattern="dd/MM/yyyy"
                                                                            showButtonPanel="true"
                                                                            navigator="true"
                                                                            autocomplete="false"/>
                                                            </f:facet>
                                                        </p:cellEditor>
                                                    </p:column>

                                                    <p:column headerText="Condicion" >
                                                        <h:outputText value="#{cuota.condicion()}"/>
                                                    </p:column>
                                                </p:dataTable>
                                            </p:panel>

                                            <div class="ui-g ui-fluid">
                                                <div class="ui-g-12 ui-md-2">
                                                    <p:commandButton value="Guardar" icon="fa fa-save" actionListener="#{EstudianteNuevoController.registrarEstudiante()}" update="form"/>
                                                </div>

                                                <div class="ui-g-12 ui-md-2">
                                                    <p:commandButton value="Cancelar" icon="fa fa-remove" process="@this" actionListener="#{EstudianteNuevoController.cancelar()}" update="form"/>
                                                </div>
                                            </div>
                                        </p:tab>
                                    </p:wizard>

                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
