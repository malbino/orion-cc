<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="./../../WEB-INF/systemTemplate.xhtml">

            <ui:define name="content">
                <div class="row">
                    <div class="col-md-12 col-sm-12 ">
                        <div class="x_panel">
                            <div class="x_title">
                                <h2>Editar Carrera <small>editar carrera existente</small></h2>

                                <div class="clearfix"></div>
                            </div>

                            <div class="x_content">
                                <h:form id="form">
                                    <p:messages/>

                                    <div class="ui-g ui-fluid">
                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="codigo" value="Codigo:" style="font-size: small"/>
                                            <p:inputText id="codigo" value="#{CarreraController.seleccionCarrera.codigo}" required="true" requiredMessage="* Codigo requerido." />
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="nombre" value="Nombre:" style="font-size: small"/>
                                            <p:inputText id="nombre" value="#{CarreraController.seleccionCarrera.nombre}" required="true" requiredMessage="* Nombre requerido." />
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="nivelAcademico" value="Nivel académico:" style="font-size: small"/>
                                            <p:selectOneMenu id="nivelAcademico" value="#{CarreraController.seleccionCarrera.nivelAcademico}" converter="#{NivelAcademicoConverter}" autoWidth="false" required="true" requiredMessage="* Nivel académico requerido."> 
                                                <f:selectItem itemLabel="" itemValue="" />
                                                <f:selectItems value="#{CarreraController.listaNivelesAcademicos()}" var="nivelAcademico" itemLabel="#{nivelAcademico.toString()}" itemValue="#{nivelAcademico}"/>  
                                            </p:selectOneMenu> 
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="version" value="Versión:" style="font-size: small"/>
                                            <p:inputText id="version" value="#{CarreraController.seleccionCarrera.version}" required="true" requiredMessage="* Versión requerida." />
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="precio" value="Precio (Bs.):" style="font-size: small"/>
                                            <p:inputNumber id="precio" value="#{CarreraController.seleccionCarrera.precio}" minValue="0" decimalPlaces="2" required="true" requiredMessage="* Precio requerido."/>
                                        </div>

                                        <div class="ui-g-12 ui-md-4">
                                            <p:outputLabel for="jefeCarrera" value="Jefe Carrera:" style="font-size: small"/>
                                            <p:autoComplete id="jefeCarrera" value="#{CarreraController.seleccionCarrera.jefeCarrera}" completeMethod="#{CarreraController.completarEmpleado}" minQueryLength="3" queryDelay="1000" scrollHeight="300"
                                                            var="jefeCarrera" itemLabel="#{jefeCarrera.toString()}" itemValue="#{jefeCarrera}" converter="#{EmpleadoConverter}" forceSelection="true"
                                                            required="true" requiredMessage="* Jefe de Carrera requerido."/>
                                        </div>
                                    </div>

                                    <p:remoteCommand name="pp" update="planesPago"/>
                                    <p:dataTable id="planesPago" var="planPago" rowKey="#{planPago.hashCode()}" rowIndexVar="rowIndex" value="#{CarreraController.seleccionCarrera.planesPago}"
                                                 editable="true" editMode="cell" emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                        <f:facet name="header">
                                            Planes de Pago
                                        </f:facet>

                                        <p:column headerText="No" >
                                            <h:outputText value="#{rowIndex + 1}"/>
                                        </p:column>

                                        <p:column headerText="Nombre" >
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{planPago.nombre}"/>
                                                </f:facet>
                                                <f:facet name="input">
                                                    <p:inputText value="#{planPago.nombre}" size="50"/>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>

                                        <p:column headerText="Numero de Cuotas" style="text-align: right">
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{planPago.numeroCuotas}"/>
                                                </f:facet>
                                                <f:facet name="input">
                                                    <p:inputNumber value="#{planPago.numeroCuotas}" minValue="0" decimalPlaces="0" emptyValue="zero" size="10">
                                                        <p:ajax event="change" oncomplete="pp()"/>
                                                    </p:inputNumber>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>

                                        <p:column headerText="Monto Cuota (Bs.)" style="text-align: right">
                                            <p:cellEditor>
                                                <f:facet name="output">
                                                    <h:outputText value="#{planPago.montoCuota()}"/>
                                                </f:facet>
                                                <f:facet name="input">
                                                    <p:inputNumber value="#{planPago.montoCuota}" minValue="0" decimalPlaces="2" emptyValue="zero" size="10">
                                                        <p:ajax event="change" oncomplete="pp()"/>
                                                    </p:inputNumber>
                                                </f:facet>
                                            </p:cellEditor>
                                        </p:column>

                                        <p:column headerText="Total (Bs)" style="text-align: right">
                                            <h:outputText value="#{planPago.total()}"/>
                                        </p:column>

                                        <p:column> 
                                            <h:panelGroup id="group" >
                                                <p:commandButton title="Eliminar" icon="fa fa-close" process="@this" update=":form:planesPago">  
                                                    <f:setPropertyActionListener value="#{planPago}" target="#{CarreraController.planPago}" />
                                                    <f:actionListener binding="#{CarreraController.eliminarPlanPago_EditarCarrera()}"/>
                                                </p:commandButton>
                                            </h:panelGroup>
                                        </p:column>

                                        <f:facet name="footer">
                                            <p:commandButton value="Añadir" icon="fa fa-plus" process="@this" actionListener="#{CarreraController.nuevoPlanPago_EditarCarrera()}" update=":form:planesPago"/>
                                            <p:spacer width="5"/>
                                            <p:commandButton value="Limpiar" icon="fa fa-trash" process="@this" actionListener="#{CarreraController.limpiarPlanesPago_EditarCarrera()}" update=":form:planesPago"/>
                                        </f:facet>  

                                    </p:dataTable>

                                    <div class="ui-g ui-fluid">
                                        <div class="ui-g-12 ui-md-2">
                                            <p:commandButton value="Guardar" icon="fa fa-save" actionListener="#{CarreraController.editarCarrera()}" update="form"/>
                                        </div>

                                        <div class="ui-g-12 ui-md-2">
                                            <p:commandButton value="Cancelar" icon="fa fa-remove" process="@this" actionListener="#{CarreraController.toCarreras()}"/>
                                        </div>
                                    </div>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
