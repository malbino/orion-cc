<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>
        <ui:composition template="./../WEB-INF/systemTemplate.xhtml">

            <ui:define name="content">
                <div class="row">
                    <div class="col-md-12 col-sm-12 ">
                        <h:form id="form">
                            <div class="x_panel">
                                <div class="x_title">
                                    <div class="ui-g ui-fluid">
                                        <h2>Nota Final <small>registro nota final</small></h2>
                                    </div>   
                                    <div class="clearfix"></div>
                                </div>

                                <div class="x_content">
                                    <p:messages id="messages" closable="true"/>

                                    <div class="ui-g ui-fluid">
                                        <div class="ui-g-12 ui-md-3">
                                            <p:outputLabel for="gestionAcademica" value="Gestión Académica: " style="font-size: small"/>
                                            <p:selectOneMenu id="gestionAcademica" value="#{NotaFinalController.seleccionGestionAcademica}" converter="#{GestionAcademicaConverter}" autoWidth="false" required="true" requiredMessage="* Gestion academica requerida."> 
                                                <f:selectItem itemLabel="" itemValue="" />
                                                <f:selectItems value="#{NotaFinalController.listaGestionesAcademicas()}" var="gestionAcademica" itemLabel="#{gestionAcademica.toString()}" itemValue="#{gestionAcademica}"/>  

                                                <p:ajax update="grupo"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="ui-g-12 ui-md-3">
                                            <p:outputLabel for="carrera" value="Carrera: " style="font-size: small"/>
                                            <p:selectOneMenu id="carrera" value="#{NotaFinalController.seleccionCarrera}" converter="#{CarreraConverter}" autoWidth="false" required="true" requiredMessage="* Carrera requerida."> 
                                                <f:selectItem itemLabel="" itemValue="" />
                                                <f:selectItems value="#{NotaFinalController.listaCarreras()}" var="carrera" itemLabel="#{carrera.toString()}" itemValue="#{carrera}"/>  

                                                <p:ajax update="grupo"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="ui-g-12 ui-md-3">
                                            <p:outputLabel for="campus" value="Campus: " style="font-size: small"/>
                                            <p:selectOneMenu id="campus" value="#{NotaFinalController.seleccionCampus}" converter="#{CampusConverter}" autoWidth="false">
                                                <f:selectItem itemLabel="" itemValue=""/>
                                                <f:selectItems value="#{NotaFinalController.listaCampus()}" var="campus" itemLabel="#{campus.toString()}" itemValue="#{campus}"/>

                                                <p:ajax update="grupo"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="ui-g-12 ui-md-3">
                                            <p:outputLabel for="grupo" value="Grupo: " style="font-size: small"/>
                                            <p:selectOneMenu id="grupo" value="#{NotaFinalController.seleccionGrupo}" converter="#{GrupoConverter}" autoWidth="false" required="true" requiredMessage="* Grupo requerido."> 
                                                <f:selectItem itemLabel="" itemValue="" />
                                                <f:selectItems value="#{NotaFinalController.listaGrupos()}" var="grupo" itemLabel="#{grupo.toString_RegistroParcial()}" itemValue="#{grupo}"/>  

                                                <p:ajax listener="#{NotaFinalController.actualizarNotas()}" update="toolbar panelNotas"/>
                                            </p:selectOneMenu>
                                        </div>
                                    </div>

                                    <p:spacer/>

                                    <p:toolbar id="toolbar">
                                        <f:facet name="left">
                                            <p:commandButton icon="fa fa-save" value="Guardar" actionListener="#{NotaFinalController.guardar()}" update=":form"/>

                                            <p:spacer width="10"/>

                                            <p:commandButton icon="fa fa-file-pdf-o" value="Planilla PDF" ajax="false" actionListener="#{NotaFinalController.generarPDF()}"/>
                                        </f:facet>

                                        <f:facet name="right">
                                            <p:menuButton icon="fa fa-gear" title="Opciones">
                                                <p:menuitem value="Exportar" icon="fa fa-file-excel-o" ajax="false">
                                                    <p:dataExporter type="xlsx" target="notas" fileName="notas" />
                                                </p:menuitem>
                                                <p:menuitem value="Lista Estudiantes" icon="fa fa-file-excel-o" ajax="false">
                                                    <p:dataExporter type="xlsx" target="lista_estudiantes" fileName="lista_estudiantes" />
                                                </p:menuitem>
                                            </p:menuButton>
                                        </f:facet>
                                    </p:toolbar>

                                    <p:spacer/>

                                    <p:outputPanel id="panelNotas">
                                        <p:dataTable id="notas" var="nota" value="#{NotaFinalController.notas}"
                                                     rowIndexVar="rowIndex" editable="true" editMode="cell" reflow="true" 
                                                     emptyMessage="Ningún registro encontrado." tableStyle="width:auto; min-width:100%">

                                            <p:column headerText="Nro">  
                                                <h:outputText value="#{rowIndex + 1}"/>
                                            </p:column>

                                            <p:column headerText="Estudiante">  
                                                <h:outputText value="#{nota.inscrito.estudiante.toString()}"/>
                                            </p:column>

                                            <p:column headerText="Modalidad" style="text-align: center;">  
                                                <h:outputText value="#{nota.modalidad.nombre}"/>
                                            </p:column>

                                            <p:column headerText="Nota Final" style="text-align: center;">  
                                                <p:cellEditor>
                                                    <f:facet name="output"><h:outputText value="#{nota.notaFinal}" /></f:facet>
                                                    <f:facet name="input">
                                                        <p:inputNumber value="#{nota.notaFinal}" minValue="0" maxValue="100" decimalPlaces="0" size="3">
                                                            <p:ajax event="keyup" listener="#{NotaFinalController.editarNota(nota)}" update="condicion" />  
                                                        </p:inputNumber>
                                                    </f:facet> 
                                                </p:cellEditor>
                                            </p:column>

                                            <p:column headerText="Recuperatorio" style="text-align: center;">  
                                                <h:outputText value="#{nota.recuperatorio}"/>
                                            </p:column>

                                            <p:column headerText="Condicion" style="text-align: center;">
                                                <h:outputText id="condicion" value="#{nota.condicion.nombre}"/>
                                            </p:column>
                                        </p:dataTable>


                                        <p:dataTable id="lista_estudiantes" var="nota" value="#{NotaFinalController.notas}" rowIndexVar="rowIndex" rendered="false">
                                            <p:column headerText="Nº">
                                                <h:outputText value="#{rowIndex + 1}"/>
                                            </p:column>

                                            <p:column headerText="Primer Apellido" >  
                                                <h:outputText value="#{nota.estudiante.primerApellido}"/>
                                            </p:column>

                                            <p:column headerText="Segundo Apellido" >  
                                                <h:outputText value="#{nota.estudiante.segundoApellido}"/>
                                            </p:column>

                                            <p:column headerText="Nombre" >  
                                                <h:outputText value="#{nota.estudiante.nombre}"/>
                                            </p:column>

                                            <p:column headerText="Sexo" >  
                                                <h:outputText value="#{nota.estudiante.sexo}"/>
                                            </p:column>

                                            <p:column headerText="DNI" >  
                                                <h:outputText value="#{nota.estudiante.dniLugar()}"/>
                                            </p:column>

                                            <p:column headerText="Dirección" >  
                                                <h:outputText value="#{nota.estudiante.direccion}"/>
                                            </p:column>

                                            <p:column headerText="Telefono" >  
                                                <h:outputText value="#{nota.estudiante.telefono}"/>
                                            </p:column>

                                            <p:column headerText="Celular" >  
                                                <h:outputText value="#{nota.estudiante.celular}"/>
                                            </p:column>

                                            <p:column headerText="Email" >  
                                                <h:outputText value="#{nota.inscrito.estudiante.email}"/>
                                            </p:column>
                                        </p:dataTable>
                                    </p:outputPanel>
                                </div>
                            </div>
                        </h:form>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
